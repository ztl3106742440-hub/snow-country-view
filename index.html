<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="color-scheme" content="light dark">
  <title>雪国十一日 · 私人旅行手册</title>
  <style>
    :root {
      font: 16px/1.6 system-ui, "Microsoft YaHei", sans-serif;
      color: #183538;
      background: #e4efed;
    }
    * { box-sizing: border-box; }
    body {
      min-height: 100vh;
      min-height: 100svh;
      margin: 0;
      padding: 24px;
      display: grid;
      place-items: center;
      background: radial-gradient(ellipse at 18% 0, #faf7e8 0, transparent 58%),
        linear-gradient(140deg, #e4efed, #aec5cd);
    }
    main {
      width: min(100%, 430px);
      padding: clamp(24px, 6vw, 42px);
      border: 1px solid #fff;
      border-radius: 23px;
      background: #f8fbfa;
      box-shadow: 0 24px 65px #203d432a;
    }
    .eyebrow { color: #40686d; font-size: .72rem; letter-spacing: .18em; font-weight: 700; }
    h1 { margin: .3em 0 .2em; font: 700 clamp(1.9rem, 7vw, 2.65rem)/1.2 Georgia, "Songti SC", SimSun, serif; }
    .intro { color: #426166; margin: .65em 0 1.45em; }
    label { display: block; font-weight: 650; margin-bottom: 6px; }
    .field { display: flex; gap: 8px; }
    input, button { min-height: 44px; border-radius: 9px; font: inherit; }
    input { min-width: 0; flex: 1; border: 1px solid #94aeb2; padding: 9px 11px; background: #fff; color: inherit; }
    button { padding: 9px 14px; border: 1px solid transparent; cursor: pointer; }
    button:disabled { opacity: .65; cursor: wait; }
    :focus-visible { outline: 3px solid #558b92; outline-offset: 3px; }
    #reveal { background: #e4eeed; color: #24494e; }
    #unlock { width: 100%; margin-top: 12px; background: #204d52; color: #fff; font-weight: 700; }
    #status { min-height: 1.6em; margin: 12px 0 0; color: #853822; font-size: .9rem; }
    @media (prefers-color-scheme: dark) {
      :root { color: #e8f4f0; background: #15272c; }
      body { background: radial-gradient(ellipse at 18% 0, #2e4748 0, transparent 60%), #15272c; }
      main { background: #1e3539; border-color: #436367; }
      .eyebrow, .intro { color: #b5d0d0; }
      input { background: #17292d; border-color: #648488; }
      #reveal { background: #304e51; color: #e8f4f0; }
      #unlock { background: #a4d6d0; color: #14393e; }
      #status { color: #ffc7b3; }
    }
  </style>
  <script src="./unlock.js" defer></script>
</head>
<body>
  <main>
    <div class="eyebrow">SNOW COUNTRY · PRIVATE JOURNAL</div>
    <h1>雪国十一日</h1>
    <p class="intro">输入密码，打开完整旅行手册。</p>
    <form id="gate">
      <label for="password">手册密码</label>
      <div class="field">
        <input id="password" type="password" autocomplete="current-password" autocapitalize="off" spellcheck="false" required>
        <button type="button" id="reveal" aria-controls="password" aria-pressed="false">显示</button>
      </div>
      <button type="submit" id="unlock" disabled>打开攻略</button>
      <p id="status" role="status"></p>
    </form>
    <noscript>请在浏览器中启用 JavaScript 后打开手册。</noscript>
  </main>
</body>
</html>
